<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shikhon Auto Spare Parts API - Swagger UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui.css" />
  <link rel="icon" type="image/png" href="https://unpkg.com/swagger-ui-dist@5.18.2/favicon-32x32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="https://unpkg.com/swagger-ui-dist@5.18.2/favicon-16x16.png" sizes="16x16" />
  <style>
    html {
      box-sizing: border-box;
      overflow-y: scroll;
    }
    *, *:before, *:after {
      box-sizing: inherit;
    }
    body {
      margin: 0;
      background: #fafafa;
    }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-standalone-preset.js"></script>
  <script>
    const DEFAULT_API_KEY = "sb_publishable_xSR0yiIJFDYy47qtibxLNA_EQlfuLdv";

    window.onload = function() {
      const ui = SwaggerUIBundle({
        url: "./swagger.json?t=" + new Date().getTime(),
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "StandaloneLayout",
        filter: true,
        tryItOutEnabled: true,
        persistAuthorization: true,
        requestInterceptor: (req) => {
          // Allow fetching local swagger definition and static assets without interception
          if (!req.url || req.url.includes("swagger.json") || !req.url.startsWith("http")) {
            return req;
          }

          // Inject Supabase routing project apikey header
          req.headers['apikey'] = DEFAULT_API_KEY;

          // Allow public authentication endpoints (login and signup) to execute freely
          const url = req.url.toLowerCase();
          const isAuthOpenEndpoint = url.includes('/auth/v1/token') || url.includes('/auth/v1/signup');

          if (isAuthOpenEndpoint) {
            return req;
          }

          // For protected endpoints, check if user provided a valid Bearer JWT access token
          const authHeader = req.headers['Authorization'] || req.headers['authorization'];
          const hasValidBearer = authHeader &&
                                 typeof authHeader === 'string' &&
                                 authHeader.startsWith('Bearer ') &&
                                 authHeader.length > 40 &&
                                 !authHeader.includes('missing_access_token') &&
                                 !authHeader.includes(DEFAULT_API_KEY);

          // If no valid user token is present, ensure request is rejected with 401 Unauthorized by the backend
          if (!hasValidBearer) {
            req.headers['Authorization'] = 'Bearer missing_access_token_please_authorize_first';
          }

          return req;
        }
      });

      window.ui = ui;
    };
  </script>
</body>
</html>
