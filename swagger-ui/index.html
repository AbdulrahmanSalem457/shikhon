<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shikhon (شيخون) Auto Spare Parts API - Swagger UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui.css" />
  <link rel="icon" type="image/png" href="https://unpkg.com/swagger-ui-dist@5.18.2/favicon-32x32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="https://unpkg.com/swagger-ui-dist@5.18.2/favicon-16x16.png" sizes="16x16" />
  <style>
    html {
      box-sizing: border-box;
      overflow-y: scroll;
    }
    *, *:before, *:after {
      box-sizing: inherit;
    }
    body {
      margin: 0;
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .topbar {
      background-color: #0f172a !important;
      border-bottom: 2px solid #0284c7;
    }
    .auth-banner {
      background: linear-gradient(90deg, #0284c7, #0ea5e9);
      color: #ffffff;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .auth-banner code {
      background: rgba(0,0,0,0.25);
      padding: 3px 8px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="auth-banner">
    <div>
      <span>⚡ تم تفعيل مفتاح الربط تلقائياً (Auto-Authenticated): </span>
      <code>sb_publishable_xSR0yiIJFDYy47qtibxLNA_EQlfuLdv</code>
    </div>
    <span style="font-size: 11px; opacity: 0.9;">Ready for instant testing (Try it out)</span>
  </div>

  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-standalone-preset.js"></script>
  <script>
    const DEFAULT_API_KEY = "sb_publishable_xSR0yiIJFDYy47qtibxLNA_EQlfuLdv";

    window.onload = function() {
      const ui = SwaggerUIBundle({
        url: "./swagger.json?t=" + new Date().getTime(),
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "StandaloneLayout",
        filter: true,
        tryItOutEnabled: true,
        requestInterceptor: (req) => {
          // Automatically inject Supabase apikey into EVERY outgoing request
          const keyToUse = req.headers['apikey'] || localStorage.getItem('supabase_anon_key') || DEFAULT_API_KEY;
          req.headers['apikey'] = keyToUse;
          
          if (!req.headers['Authorization']) {
            req.headers['Authorization'] = 'Bearer ' + keyToUse;
          }
          return req;
        }
      });

      // Pre-authorize ApiKeyAuth so Swagger UI displays authorized by default
      setTimeout(() => {
        try {
          ui.preauthorizeApiKey("ApiKeyAuth", DEFAULT_API_KEY);
        } catch (e) {
          console.warn('Preauthorize:', e);
        }
      }, 500);

      window.ui = ui;
    };
  </script>
</body>
</html>
