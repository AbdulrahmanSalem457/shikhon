<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Shikhon (شيخون) Auto Spare Parts API - Swagger UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui.css" />
  <link rel="icon" type="image/png" href="https://unpkg.com/swagger-ui-dist@5.18.2/favicon-32x32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="https://unpkg.com/swagger-ui-dist@5.18.2/favicon-16x16.png" sizes="16x16" />
  <style>
    html {
      box-sizing: border-box;
      overflow-y: scroll;
    }
    *, *:before, *:after {
      box-sizing: inherit;
    }
    body {
      margin: 0;
      background: #0b1120;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", Helvetica, Arial, sans-serif;
    }
    .swagger-ui {
      background: #f8fafc;
      direction: ltr;
    }
    .topbar {
      background-color: #0f172a !important;
      border-bottom: 2px solid #ea580c;
    }
    .auth-banner {
      background: #0f172a;
      border-bottom: 2px solid #f97316;
      color: #f8fafc;
      padding: 12px 24px;
      font-size: 13px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      direction: rtl;
    }
    .auth-banner-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }
    .badge-locked {
      background: #ef4444;
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .auth-banner-steps {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #cbd5e1;
      flex-wrap: wrap;
    }
    .step-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .step-num {
      background: #f97316;
      color: #fff;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
    }
    .step-arrow {
      color: #64748b;
      font-weight: bold;
    }
    .auth-banner code {
      background: rgba(255,255,255,0.12);
      padding: 2px 7px;
      border-radius: 4px;
      font-family: monospace;
      color: #38bdf8;
      font-size: 11px;
      direction: ltr;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="auth-banner">
    <div class="auth-banner-left">
      <span class="badge-locked">🔒 مغلق ومحمي</span>
      <span>لا يمكن تجربة أي API حتى تسجّل الدخول وتفعّل رمز الوصول <code>access_token</code> عبر زر <b>Authorize 🔓</b></span>
    </div>
    <div class="auth-banner-steps">
      <span class="step-item"><span class="step-num">1</span> استدعِ الدخول من <code>/auth/v1/token</code></span>
      <span class="step-arrow">◀</span>
      <span class="step-item"><span class="step-num">2</span> انسخ <code>access_token</code></span>
      <span class="step-arrow">◀</span>
      <span class="step-item"><span class="step-num">3</span> اضغط <b>Authorize 🔓</b> بالأعلى والصق الرمز</span>
    </div>
  </div>

  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-standalone-preset.js"></script>
  <script>
    const DEFAULT_API_KEY = "sb_publishable_xSR0yiIJFDYy47qtibxLNA_EQlfuLdv";

    window.onload = function() {
      const ui = SwaggerUIBundle({
        url: "./swagger.json?t=" + new Date().getTime(),
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "StandaloneLayout",
        filter: true,
        tryItOutEnabled: true,
        persistAuthorization: true,
        requestInterceptor: (req) => {
          // Always ensure Supabase project apikey header is present for internal backend routing
          req.headers['apikey'] = DEFAULT_API_KEY;

          // Check if this request is targeting the public login or registration endpoints
          const url = (req.url || '').toLowerCase();
          const isPublicAuth = url.includes('/auth/v1/token') || url.includes('/auth/v1/signup');

          // Login and signup endpoints are allowed so the user can obtain an access_token
          if (isPublicAuth) {
            return req;
          }

          // For all other protected endpoints, verify a real user JWT Bearer token is provided
          const authHeader = req.headers['Authorization'] || req.headers['authorization'];
          const hasValidBearer = authHeader &&
                                 typeof authHeader === 'string' &&
                                 authHeader.startsWith('Bearer ') &&
                                 authHeader.length > 40 &&
                                 !authHeader.includes(DEFAULT_API_KEY);

          if (!hasValidBearer) {
            const warningMsg = "⛔ طلب محظور - يلزم رمز الوصول (Access Token Required)!\n\n" +
              "لا يمكن تجربة هذه الواجهة البرمجية قبل تسجيل الدخول وتفعيل رمز الوصول:\n\n" +
              "1. توجّه لقسم Authentication واستدعِ /auth/v1/token ببيانات المشرف.\n" +
              "2. انسخ قيمة الـ access_token من نتيجة الرد.\n" +
              "3. اضغط على الزر الأخضر (Authorize 🔓) أعلى يمين الصفحة والصق التوكن واضغط Authorize.\n\n" +
              "بعدها ستفتح جميع الواجهات البرمجية وتعمل معك بنجاح.";

            alert(warningMsg);
            throw new Error("Execution blocked: A valid Bearer access_token is required. Please authorize via Swagger UI first.");
          }

          return req;
        }
      });

      window.ui = ui;
    };
  </script>
</body>
</html>
