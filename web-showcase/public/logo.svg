<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Glow Ring -->
  <circle cx="50" cy="50" r="42" stroke="url(#grad1)" stroke-width="2.5" opacity="0.6" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="38" fill="url(#glassGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <!-- Rotor / Gear Blades -->
  <g transform="translate(50, 50)" stroke="url(#grad1)" stroke-width="3.5" stroke-linecap="round">
    <path d="M0,-28 L0,-16" />
    <path d="M20,-20 L11,-11" />
    <path d="M28,0 L16,0" />
    <path d="M20,20 L11,11" />
    <path d="M0,28 L0,16" />
    <path d="M-20,20 L-11,11" />
    <path d="M-28,0 L-16,0" />
    <path d="M-20,-20 L-11,-11" />
  </g>
  <!-- Center Core -->
  <circle cx="50" cy="50" r="10" fill="url(#grad1)" />
  <circle cx="47" cy="47" r="4" fill="white" opacity="0.6" />
</svg>
