<svg viewBox="-5 6 130 108" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium automotive sapphire gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <!-- Metallic Car Body Interior Fill -->
    <linearGradient id="bodyFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Windshield Tint & Specular Shine -->
    <linearGradient id="windshieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0369a1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="windshieldShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Chrome & Silver Highlights -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.3" />
    </linearGradient>

    <!-- Xenon LED Headlight Glow -->
    <linearGradient id="headlightGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Carbon Fiber Lower Splitter -->
    <linearGradient id="carbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="15%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="85%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Car Cabin / Roof / Windshield Silhouette (Solid Base) -->
  <!-- Roof Arc -->
  <path d="M42,32 Q60,22 78,32 L86,45 Q60,42 34,45 Z" fill="url(#windshieldGrad)" stroke="url(#bodyGrad)" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Windshield Reflection Highlight -->
  <path d="M45,33 Q60,24 75,33 L78,43 Q60,41 42,43 Z" fill="url(#windshieldShine)" />

  <!-- Side View Mirrors -->
  <path d="M34,44 L25,41 Q22,43 26,47 L33,48 Z" fill="url(#bodyGrad)" stroke="url(#chromeGrad)" stroke-width="1.2" />
  <path d="M86,44 L95,41 Q98,43 94,47 L87,48 Z" fill="url(#bodyGrad)" stroke="url(#chromeGrad)" stroke-width="1.2" />

  <!-- Muscular Supercar Body Profile (Solid metallic fill) -->
  <path d="M19,57 C19,47 28,45 36,45 L84,45 C92,45 101,47 101,57 C101,66 97,74 93,78 L87,84 C81,88 69,90 60,90 C51,90 39,88 33,84 L27,78 C23,74 19,66 19,57 Z" 
        fill="url(#bodyFill)" 
        stroke="url(#bodyGrad)" 
        stroke-width="3.5" 
        stroke-linejoin="round" />

  <!-- Hood Aerodynamic Sculpt Lines -->
  <path d="M41,46 L47,68" stroke="url(#chromeGrad)" stroke-width="2.2" stroke-linecap="round" />
  <path d="M79,46 L73,68" stroke="url(#chromeGrad)" stroke-width="2.2" stroke-linecap="round" />
  <path d="M60,45 L60,66" stroke="url(#bodyGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- Aggressive LED Matrix Headlights (Xenon Glow) -->
  <!-- Left Headlight -->
  <path d="M23,57 L39,63 L36,66 L21,61 Z" fill="url(#headlightGlow)" />
  <path d="M24,56 L38,61" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

  <!-- Right Headlight -->
  <path d="M97,57 L81,63 L84,66 L99,61 Z" fill="url(#headlightGlow)" />
  <path d="M96,56 L82,61" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

  <!-- Front Honeycomb Air Intake / Intercooler Grille -->
  <path d="M38,71 L82,71 L78,84 L42,84 Z" fill="#090d16" stroke="url(#bodyGrad)" stroke-width="2" />
  <!-- Grille Honeycomb / Louver lines -->
  <line x1="44" y1="75" x2="76" y2="75" stroke="#0284c7" stroke-width="1.2" opacity="0.6" />
  <line x1="46" y1="79" x2="74" y2="79" stroke="#0284c7" stroke-width="1.2" opacity="0.6" />

  <!-- Center Engine Piston Emblem inside the Grille (Auto Parts Icon) -->
  <g transform="translate(60, 77)">
    <rect x="-6.5" y="-4.5" width="13" height="7" rx="1.5" fill="url(#chromeGrad)" stroke="#38bdf8" stroke-width="0.8" />
    <line x1="-5.5" y1="-2" x2="5.5" y2="-2" stroke="#0284c7" stroke-width="1" />
    <line x1="-5.5" y1="0.5" x2="5.5" y2="0.5" stroke="#0284c7" stroke-width="1" />
    <!-- Connecting Rod -->
    <path d="M-2.5,2.5 L-2.5,8 L2.5,8 L2.5,2.5 Z" fill="url(#chromeGrad)" />
    <circle cx="0" cy="5.5" r="1.2" fill="#0284c7" />
  </g>

  <!-- Front Carbon Aerodynamic Splitter with Winglets -->
  <path d="M14,85 Q60,94 106,85 L104,90 Q60,99 16,90 Z" fill="url(#carbonGrad)" stroke="url(#bodyGrad)" stroke-width="1.5" />
  <!-- Splitter Left Winglet -->
  <path d="M14,85 L13,80 L17,84 Z" fill="url(#bodyGrad)" />
  <!-- Splitter Right Winglet -->
  <path d="M106,85 L107,80 L103,84 Z" fill="url(#bodyGrad)" />

  <!-- Aerodynamic Side Speed Aero-Fins -->
  <path d="M11,51 L17,49" stroke="url(#bodyGrad)" stroke-width="2.8" stroke-linecap="round" />
  <path d="M9,59 L15,59" stroke="url(#bodyGrad)" stroke-width="2.8" stroke-linecap="round" />
  <path d="M11,67 L17,69" stroke="url(#bodyGrad)" stroke-width="2.8" stroke-linecap="round" />

  <path d="M109,51 L103,49" stroke="url(#bodyGrad)" stroke-width="2.8" stroke-linecap="round" />
  <path d="M111,59 L105,59" stroke="url(#bodyGrad)" stroke-width="2.8" stroke-linecap="round" />
  <path d="M109,67 L103,69" stroke="url(#bodyGrad)" stroke-width="2.8" stroke-linecap="round" />
</svg>
